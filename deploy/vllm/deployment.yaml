# deploy/vllm/deployment.yaml (simulator path)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm
  labels: {app: llm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: llm}
  template:
    metadata:
      labels: {app: llm}
    spec:
      containers:
        - name: server            # keep this generic; vLLM replaces it later
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0   # from the simulator's README
          args: ["--model", "sim-model", "--port", "8000", "--mode", "echo"]
          ports: [{containerPort: 8000, name: http}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}