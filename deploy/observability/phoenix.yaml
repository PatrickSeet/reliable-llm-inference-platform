apiVersion: v1
kind: Namespace
metadata: {name: observability}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: phoenix, namespace: observability, labels: {app: phoenix}}
spec:
  replicas: 1
  selector: {matchLabels: {app: phoenix}}
  template:
    metadata: {labels: {app: phoenix}}
    spec:
      enableServiceLinks: false        # add: stop Kubernetes injecting Service env vars
      containers:
        - name: phoenix
          image: arizephoenix/phoenix:version-20.21.1
          env:
            - {name: PHOENIX_WORKING_DIR, value: /mnt/data}
            - {name: PHOENIX_PORT, value: "6006"}   # add: set it explicitly
          ports:
            - {containerPort: 6006, name: http}    # UI + OTLP over HTTP
            - {containerPort: 4317, name: grpc}    # OTLP over gRPC
          readinessProbe:
            tcpSocket: {port: 6006}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /mnt/data}]
      volumes:
        - name: data
          emptyDir: {}      # traces are lost when the pod restarts; fine for now
---
apiVersion: v1
kind: Service
metadata: {name: phoenix, namespace: observability, labels: {app: phoenix}}
spec:
  selector: {app: phoenix}
  ports:
    - {name: http, port: 6006, targetPort: 6006}
    - {name: grpc, port: 4317, targetPort: 4317}